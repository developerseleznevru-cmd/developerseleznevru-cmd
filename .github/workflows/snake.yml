# Этот файл нужен для анимации «змейки» на профиле.
# Положите его в репозиторий профиля по пути: .github/workflows/snake.yml
# Первый запуск — вручную: вкладка Actions → Generate Snake → Run workflow.

name: Generate Snake

on:
  push:
    branches: [main]       # первый запуск сразу после публикации
  schedule:
    - cron: "0 0 * * *"   # обновление каждый день в 00:00 UTC
  workflow_dispatch:       # возможность запустить вручную

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Генерация SVG змейки
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: developerseleznevru-cmd
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Публикация в ветку output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
